opencgl.custom_plugin.help.content=Custom plugins let you add web pages or local HTML, opened from the sidebar.\nAdd: Click \"Add Plugin\", enter name and URL/path, optional icon.\nOpen: Click a card to open in a new tab.\nEdit: Right-click card \"Edit\" to change name, URL, or icon; if that tab is open, close it first.\nDelete: Right-click \"Delete\" or multi-select then \"Delete\".\nSearch: Type in the search box to filter by name.\nCompatibility: Content is shown in WebView. Pages built with React, Vue, Angular, etc. may not work correctly; use static HTML or simple pages when possible.
