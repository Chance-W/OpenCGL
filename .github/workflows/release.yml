name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare clean release directory
        run: rm -rf release && mkdir -p release
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Verify release set
        run: python build/verify_release.py release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Tag 对应的 Release 可能已由上一次失败任务创建；此时复用并补传产物。
          rm -rf release-assets
          mkdir -p release-assets
          for platform_dir in release/*/; do
            platform="$(basename "$platform_dir")"
            platform="${platform#OpenCGL-Tool-}"
            while IFS= read -r -d '' asset; do
              case "$(basename "$asset")" in
                SHA256SUMS)
                  destination="release-assets/SHA256SUMS-${platform}"
                  ;;
                build-manifest.json)
                  destination="release-assets/build-manifest-${platform}.json"
                  ;;
                *)
                  destination="release-assets/$(basename "$asset")"
                  ;;
              esac
              cp "$asset" "$destination"
            done < <(find "$platform_dir" -type f -print0)
          done
          assets=(release-assets/*)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
