name: Build

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencgl-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows-x64
            architecture: x64
          - os: macos-15-intel
            label: macos-x64
            architecture: x64
          - os: macos-15
            label: macos-arm64
            architecture: aarch64
          - os: ubuntu-24.04
            label: linux-x64
            architecture: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out host
        uses: actions/checkout@v7
        with:
          path: host
      - name: Check out shared API and Base
        uses: actions/checkout@v7
        with:
          repository: Chance-W/OpenCGL-Plugin
          path: plugins
      - name: Set up build environment
        uses: ./host/.github/actions/setup-opencgl
        with:
          architecture: ${{ matrix.architecture }}
      - name: Install Linux packaging prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Install Windows packaging prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install maven wixtoolset --no-progress --yes
      - name: Install OpenCGL API and Base dependencies
        shell: bash
        run: mvn -f plugins/pom.xml -pl PluginApiModule,OpenCGL-Base -am install -DskipTests
      - name: Build and package
        run: python host/build/build.py package --skip-tests --output release/${{ matrix.label }}
      - name: Validate platform release files
        shell: bash
        run: |
          set -euo pipefail
          output="release/${{ matrix.label }}"
          echo "Generated files for $output:"
          find "$output" -maxdepth 1 -type f -exec ls -lh {} + | sort
          test -f "$output/build-manifest.json"
          test -f "$output/SHA256SUMS"
          python host/build/verify_release.py "$output" --platform "${{ matrix.label }}"
          case "${{ matrix.label }}" in
            windows-x64) test -f "$output"/OpenCGL-Tool-*-windows-x64.exe; test -f "$output"/OpenCGL-Tool-*-windows-x64.zip ;;
            macos-x64|macos-arm64) test -f "$output"/OpenCGL-Tool-*-"${{ matrix.label }}".dmg; test -f "$output"/OpenCGL-Tool-*-"${{ matrix.label }}".tar.gz ;;
            linux-x64) test -f "$output"/OpenCGL-Tool-*-linux-x64.deb; test -f "$output"/OpenCGL-Tool-*-linux-x64.tar.gz ;;
          esac
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.label }}
          path: |
            host/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCGL-Tool-${{ matrix.label }}
          path: release/${{ matrix.label }}/
          if-no-files-found: error
